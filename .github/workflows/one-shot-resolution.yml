name: One-shot Python resolution milestone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-resolution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python-resolution-benchmarks
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply feature patch
        run: python scripts/apply_resolution_benchmark.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/zuri-core/src apps/zuri-cli/src crates/zuri-core/tests
          git commit -m "feat: deepen Python call resolution and add local benchmarks"
          git push origin HEAD:feat/python-resolution-benchmarks
