name: Repair resolution workflow

on:
  push:
    branches: ["feat/python-resolution-benchmarks"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python-resolution-benchmarks
          fetch-depth: 0
      - name: Fix custom shell template
        run: sed -i 's/shell: python$/shell: python {0}/' .github/workflows/apply-resolution-benchmark.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-resolution-benchmark.yml
          git commit -m "ci: fix Python workflow shell" || exit 0
          git push origin HEAD:feat/python-resolution-benchmarks
