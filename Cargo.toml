[workspace]
resolver = "2"
members = ["crates/zuri-core", "apps/zuri-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["CodeSage Zuri contributors"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6"
ignore = "0.4"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-python = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
